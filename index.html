<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Remaja Wakaf Haqqul Yaqin</title>
    <!-- Memanggil data anggota -->
    <script src="data.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            background-color: #f4f4f9;
        }
        #scanner-container {
            width: 100%; max-width: 500px;
            border: 2px solid #ccc; padding: 15px;
            border-radius: 10px; background: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center; box-sizing: border-box;
        }
        
        /* DESAIN KAMERA HORIZONTAL */
        #video-wrapper {
            position: relative; width: 100%; height: 250px; 
            overflow: hidden; border-radius: 10px;
            background-color: #000; margin-bottom: 10px;
        }
        video {
            width: 100%; height: 100%; object-fit: cover;
        }
        .scan-area {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; height: 60%;
            border: 3px dashed rgba(0, 255, 0, 0.7);
            border-radius: 10px; box-sizing: border-box; pointer-events: none;
        }
        .scan-line {
            position: absolute; width: 75%; height: 3px; background: red;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 10px red; pointer-events: none;
            animation: scan 2s infinite linear;
        }
        @keyframes scan {
            0% { top: 25%; }
            50% { top: 75%; }
            100% { top: 25%; }
        }

        #camera-selector {
            width: 100%; margin-bottom: 10px; padding: 10px;
            border-radius: 5px; border: 1px solid #ccc; font-size: 16px;
        }
        .btn {
            padding: 12px 20px; font-size: 16px; cursor: pointer;
            color: white; border: none; border-radius: 5px; margin: 5px 0;
            width: 100%; box-sizing: border-box; font-weight: bold;
        }
        .btn-scan { background-color: #6c63ff; }
        .btn-scan:hover { background-color: #5750d9; }
        .btn-success { background-color: #28a745; margin-top: 15px;}
        .btn-danger { background-color: #dc3545; }
        
        #output {
            margin-top: 15px; padding: 15px; border: 1px solid #c3e6cb;
            background: #d4edda; border-radius: 5px; text-align: center;
            display: none;
        }
        #output h3 { margin: 0 0 5px 0; color: #155724; font-size: 20px;}
        #output p { margin: 0; color: #155724; font-size: 14px;}
        
        #result-list {
            text-align: left; max-height: 250px; overflow-y: auto;
            border-top: 1px solid #ddd; padding-top: 10px; margin-top: 15px;
            width: 100%; max-width: 500px;
        }
        .log-item { border-bottom: 1px solid #eee; padding: 10px 0; font-size: 14px; }
        .nama-teks { font-size: 16px; font-weight: bold; color: #333; }
        .id-teks { color: #888; font-size: 12px; }
    </style>
</head>
<body>

    <h2 style="margin-bottom: 10px;">Absensi Organisasi</h2>

    <div id="scanner-container">
        <select id="camera-selector"></select>
        
        <div id="video-wrapper">
            <video id="qr-video" playsinline autoplay muted></video>
            <div class="scan-area"></div>
            <div class="scan-line" id="scan-line" style="display:none;"></div>
        </div>
        
        <button id="scan-button" class="btn btn-scan">Mulai Scanner</button>
        <button id="stop-button" class="btn btn-danger" style="display:none;">Matikan Kamera</button>
        
        <div id="output">
            <h3 id="output-nama">Nama</h3>
            <p id="output-id">ID</p>
        </div>
    </div>

    <div style="width: 100%; max-width: 500px;">
        <button onclick="exportToCSV()" class="btn btn-success">⬇️ Download Data CSV</button>
        <button onclick="clearData()" class="btn btn-danger" style="margin-top: 5px;">🗑️ Kosongkan Data</button>
        
        <h3 style="margin-bottom: 5px;">Riwayat Kehadiran:</h3>
        <div id="result-list"></div>
    </div>

    <script>
        // --- 1. INISIALISASI VARIABEL ---
        const videoElement = document.getElementById('qr-video');
        const cameraSelector = document.getElementById('camera-selector');
        const scanButton = document.getElementById('scan-button');
        const stopButton = document.getElementById('stop-button');
        const outputBox = document.getElementById('output');
        const scanLine = document.getElementById('scan-line');
        
        let currentStream = null;
        let isScanning = false;
        let lastScanned = "";
        let attendanceData = JSON.parse(localStorage.getItem('absensi_anggota_v2')) || [];
        
        // Audio Context disiapkan di luar agar tidak membebani memori
        let audioCtx;

        // --- 2. PERBAIKAN BUG PEMANGGILAN DATA ---
        // Membuat wadah penampung data agar tidak bentrok dengan data.js
        let dbAnggota = {}; 
        if (typeof dataAnggota !== 'undefined') {
            dbAnggota = dataAnggota;
        }

        updateUI();

        // --- 3. FUNGSI SUARA BEEP ---
        function playBeep() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch (e) {
                console.log("Suara beep tidak didukung di perangkat ini.");
            }
        }

        // --- 4. SISTEM KAMERA ---
        navigator.mediaDevices.enumerateDevices().then(devices => {
            const videoDevices = devices.filter(device => device.kind === 'videoinput');
            if (videoDevices.length > 0) {
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.textContent = device.label || `Kamera ${index + 1}`;
                    cameraSelector.appendChild(option);
                });
            }
        }).catch(err => console.error(err));

        cameraSelector.addEventListener('change', () => {
            if (isScanning) startCamera(cameraSelector.value);
        });

        function startCamera(cameraId) {
            if (currentStream) { currentStream.getTracks().forEach(track => track.stop()); }

            navigator.mediaDevices.getUserMedia({ video: { deviceId: cameraId ? { exact: cameraId } : undefined, facingMode: "environment" } })
                .then(stream => {
                    currentStream = stream;
                    videoElement.srcObject = stream;
                    videoElement.play();
                    isScanning = true;
                    
                    scanButton.style.display = "none";
                    stopButton.style.display = "block";
                    scanLine.style.display = "block"; 
                    
                    scanOffline();
                })
                .catch(err => alert('Gagal akses kamera: ' + err.message));
        }

        function stopCamera() {
            if (currentStream) { currentStream.getTracks().forEach(track => track.stop()); videoElement.srcObject = null; }
            isScanning = false;
            scanButton.style.display = "block";
            stopButton.style.display = "none";
            scanLine.style.display = "none"; 
        }

        // --- 5. PEMINDAI OFFLINE & NAMA ---
        async function scanOffline() {
            if (!isScanning) return;

            if ("BarcodeDetector" in window) {
                const barcodeDetector = new BarcodeDetector({ formats: ["qr_code", "ean_13", "code_128"] });
                try {
                    const barcodes = await barcodeDetector.detect(videoElement);
                    if (barcodes.length > 0) {
                        const idData = barcodes[0].rawValue;
                        
                        if (idData !== lastScanned) {
                            lastScanned = idData;
                            
                            playBeep();
                            
                            // Mencocokkan ID dengan dbAnggota (dari data.js)
                            const namaDitemukan = dbAnggota[idData] || "⚠️ (Tidak Terdaftar)";
                            simpanKeDatabase(idData, namaDitemukan);
                            
                            setTimeout(() => { lastScanned = ""; }, 2500); 
                        }
                    }
                } catch (e) { }
            }
            requestAnimationFrame(scanOffline);
        }

        // --- 6. PENYIMPANAN & UI ---
        function simpanKeDatabase(idData, nama) {
            const now = new Date();
            const timeString = now.toLocaleDateString('id-ID') + ' ' + now.toLocaleTimeString('id-ID');
            
            attendanceData.push({ id: idData, nama: nama, waktu: timeString });
            localStorage.setItem('absensi_anggota_v2', JSON.stringify(attendanceData));
            
            outputBox.style.display = "block";
            document.getElementById('output-nama').innerText = nama;
            document.getElementById('output-id').innerText = idData;
            
            if (navigator.vibrate) navigator.vibrate(100); 
            updateUI();
        }

        function updateUI() {
            const list = document.getElementById('result-list');
            list.innerHTML = '';
            [...attendanceData].reverse().forEach((item, index) => {
                let nomorUrut = attendanceData.length - index;
                list.innerHTML += `
                <div class="log-item">
                    <span class="nama-teks">${nomorUrut}. ${item.nama}</span><br>
                    <span class="id-teks">ID: ${item.id} | ${item.waktu}</span>
                </div>`;
            });
        }

        // --- 7. EKSPOR KE CSV ---
        function exportToCSV() {
            if (attendanceData.length === 0) return alert("Belum ada data!");
            let csvContent = "data:text/csv;charset=utf-8,ID Anggota,Nama Anggota,Waktu Absen\n";
            attendanceData.forEach(row => { csvContent += `${row.id},${row.nama},${row.waktu}\n`; });
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Laporan_Absensi.csv");
            document.body.appendChild(link);
            link.click();
        }

        function clearData() {
            if(confirm("Hapus semua riwayat absensi?")) {
                localStorage.removeItem('absensi_anggota_v2');
                attendanceData = [];
                outputBox.style.display = "none";
                updateUI();
            }
        }

        scanButton.addEventListener('click', () => startCamera(cameraSelector.value));
        stopButton.addEventListener('click', stopCamera);
        window.addEventListener('beforeunload', stopCamera);

    </script>
</body>
</html>
